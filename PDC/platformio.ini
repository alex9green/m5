;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stamp-plc-production

; ============================================================================
; PRODUCTION ENVIRONMENT - Upload via USB
; ============================================================================
[env:m5stamp-plc-production]
platform = espressif32
board = m5stack-stamps3
framework = arduino

; Serial Monitor Configuration
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

; Upload Configuration
upload_speed = 921600
upload_port = COM3              ; Windows: COM3, COM4, etc.
                                ; Linux: /dev/ttyUSB0, /dev/ttyACM0
                                ; Mac: /dev/cu.usbserial-*

; Build Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=4       ; 0=None, 1=Error, 2=Warn, 3=Info, 4=Debug, 5=Verbose
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D MODBUS_SLAVE_ID=1
    -D MODBUS_BAUDRATE=9600
    -D LOG_INTERVAL_SEC=30
    -D ENABLE_WIFI=1
    -D ENABLE_WEB_SERVER=1
    -D ENABLE_OTA=1

; Libraries
lib_deps = 
    m5stack/M5Unified@^0.1.16
    bblanchon/ArduinoJson@^7.0.4
    arduino-libraries/NTPClient@^3.2.1
    mathieucarbou/AsyncTCP@^3.2.4
    mathieucarbou/ESPAsyncWebServer@^3.3.15

; Partition Scheme (for OTA updates)
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; Extra Scripts
extra_scripts = 
    pre:scripts/generate_version.py

; ============================================================================
; OTA ENVIRONMENT - Upload over WiFi (după prima instalare USB)
; ============================================================================
[env:m5stamp-plc-ota]
extends = env:m5stamp-plc-production
upload_protocol = espota
upload_port = 192.168.1.100     ; IP address of M5Stamp PLC
upload_flags = 
    --port=3232
    --auth=thermxpert2026

; ============================================================================
; DEBUG ENVIRONMENT - For development with verbose logging
; ============================================================================
[env:m5stamp-plc-debug]
extends = env:m5stamp-plc-production
build_type = debug
build_flags = 
    ${env:m5stamp-plc-production.build_flags}
    -D CORE_DEBUG_LEVEL=5
    -D DEBUG_MODBUS=1
    -D DEBUG_SD_CARD=1
    -D ENABLE_SERIAL_DEBUG=1

monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time
    colorize
    log2file

; ============================================================================
; COMMON SETTINGS
; ============================================================================
[common]
lib_deps_builtin = 
    SPI
    Wire
    WiFi
    FS
    SD
    SPIFFS
    ESPmDNS
    Update
