;
; platformio.ini — M5Stack StampPLC RS485 Oscilloscope Test
; Copiaza acest fisier ca platformio.ini in radacina proiectului
;

[env:m5stack-stamps3]
platform   = espressif32
board      = m5stack-stamps3
framework  = arduino

; CRITIC: USB-CDC pentru consola, elibereaza GPIO 43/44
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Fisiere sursa
build_src_filter = +<stamplc_rs485_osctest.cpp>

monitor_speed = 115200
monitor_filters = direct
upload_speed  = 921600
