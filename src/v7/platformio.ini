; ============================================================================
; platformio.ini - M5Stack StampPLC K141 - Heat Pump Monitor v7.0
; ============================================================================
; Upload USB:  pio run -e stamplc_v7  --target upload
; Upload OTA:  pio run -e stamplc_ota --target upload
; Monitor:     pio device monitor --baud 115200
;
; v7 - Pini confirmati + Baud scan + Inter-byte gap fix
;   RS485: TX=0  RX=39  DE=46  (confirmat: CRC errors = semnal real)
;   SD:    SCK=7 MOSI=8 MISO=9 CS=10 (confirmat: "OK" in log)
;   BUTTON_A dezactivat (GPIO39 = RS485 RX)
; ============================================================================

[common]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_src_filter = +<main_v7.cpp>
monitor_filters  = esp32_exception_decoder, default, time
upload_timeout   = 60
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; PSRAM DEZACTIVAT: M5StampS3 ESP32-S3FN8 = 8MB Flash integrat, FARA PSRAM!
    ; -DBOARD_HAS_PSRAM → cauzeaza "PSRAM chip not found" si destabilizeaza UART.
    -DCURRENT_LOG_LEVEL=LOG_LEVEL_DEBUG
build_flags +=
    -I.

; ----------------------------------------------------------------------------
; ENV 1: Upload USB-C
; ----------------------------------------------------------------------------
[env:stamplc_v7]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_src_filter = ${common.build_src_filter}
monitor_filters  = ${common.monitor_filters}
upload_timeout   = ${common.upload_timeout}
build_flags      = ${common.build_flags}
upload_speed     = 921600
; upload_port = COM3  ; decommenteaza daca PIO nu gaseste portul automat

; ----------------------------------------------------------------------------
; ENV 2: Upload OTA
; IP-ul: vezi Serial Monitor la boot "WiFi: 192.168.1.XXX"
; ----------------------------------------------------------------------------
[env:stamplc_ota]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_src_filter = ${common.build_src_filter}
monitor_filters  = ${common.monitor_filters}
upload_timeout   = 120
build_flags      = ${common.build_flags}
upload_protocol  = espota
upload_port      = 192.168.1.153
upload_flags     =
    --port=3232
    --auth=thermxpert2026
