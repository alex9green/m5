; ============================================================================
; platformio.ini - M5Stack StampPLC K141 - Heat Pump Monitor v5.0
; ============================================================================
; Upload: platformio run --target upload
; Monitor: platformio device monitor --baud 115200
; ============================================================================

[env:stamplc_v5]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Upload via Serial (USB-C)
upload_speed = 921600
monitor_speed = 115200

; Partition scheme - mai mult spatiu pentru OTA
board_build.partitions = default_8MB.csv

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    ; RS485 pin oficial
    -DRS485_DE_PIN=0
    ; Log level la build time (poate fi schimbat la runtime)
    -DCURRENT_LOG_LEVEL=LOG_LEVEL_DEBUG

; Librarii necesare
lib_deps =
    ; Webserver e inclus in ESP32 framework
    ; SD e inclusa in ESP32 framework
    ; ArduinoOTA e inclusa in ESP32 framework

; Source files
build_src_filter =
    +<main_v5.cpp>

; Include paths
build_flags +=
    -I.

; Monitor filters (colorare output serial)
monitor_filters = esp32_exception_decoder, default, time

; Timeout pentru upload
upload_timeout = 60
