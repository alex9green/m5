; ============================================================================
; platformio.ini - M5Stack StampPLC K141 - Heat Pump Monitor v5.0
; ============================================================================
; USB upload:  pio run -e stamplc_v5     --target upload
; OTA upload:  pio run -e stamplc_ota    --target upload
; Monitor:     pio device monitor --baud 115200
; ============================================================================

; ----------------------------------------------------------------------------
; Setari comune (mostenite de ambele environments)
; ----------------------------------------------------------------------------
[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_src_filter = +<main_v5.cpp>
monitor_filters = esp32_exception_decoder, default, time
upload_timeout = 60
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DRS485_DE_PIN=0
    -DCURRENT_LOG_LEVEL=LOG_LEVEL_DEBUG
build_flags +=
    -I.

; ----------------------------------------------------------------------------
; ENV 1: Upload prin USB-C (cablu fizic)
; Folosire: pio run -e stamplc_v5 --target upload
; ----------------------------------------------------------------------------
[env:stamplc_v5]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_src_filter = ${common.build_src_filter}
monitor_filters  = ${common.monitor_filters}
upload_timeout   = ${common.upload_timeout}
build_flags      = ${common.build_flags}
upload_speed  = 921600
; upload_port = COM3  ; decommenteaza si schimba daca PIO nu gaseste portul

; ----------------------------------------------------------------------------
; ENV 2: Upload OTA (wireless, fara cablu - device trebuie pornit si in retea)
; Folosire: pio run -e stamplc_ota --target upload
; IP-ul se poate schimba - verifica Serial Monitor la boot: "IP: 192.168.1.XXX"
; ----------------------------------------------------------------------------
[env:stamplc_ota]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_src_filter = ${common.build_src_filter}
monitor_filters  = ${common.monitor_filters}
upload_timeout   = 120
build_flags      = ${common.build_flags}
upload_protocol  = espota
upload_port      = 192.168.1.153     ; IP-ul dispozitivului (vezi Serial Monitor)
upload_flags     =
    --port=3232
    --auth=thermxpert2026
